<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Captain POS - Topi Vappa</title>
    <!-- Self-healing script for stale mobile caches -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var reloaded = sessionStorage.getItem('captain_asset_reload');
            if (!reloaded) {
              sessionStorage.setItem('captain_asset_reload', 'true');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
                });
              }
              setTimeout(function() {
                window.location.reload();
              }, 200);
            }
          }
        }, true);
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            sessionStorage.removeItem('captain_asset_reload');
          }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
